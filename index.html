<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A1C Driving Academy TDC Examination</title>
<link rel="stylesheet" href="style.css">
<!-- Load script.js with defer or directly inside head -->
<script src="script.js" defer></script>
<style>
  /* Minimalist Transparent Footer */
  .site-footer {
    margin-top: 40px;
    padding: 24px 16px;
    background: transparent;
    color: inherit;
    font-size: 13px;
    text-align: center;
    opacity: 0.85;
  }
  .site-footer .footer-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .site-footer .footer-brand {
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .site-footer .footer-links {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .site-footer .footer-links a {
    color: inherit;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }
  .site-footer .footer-links a:hover {
    text-decoration: underline;
    opacity: 1;
  }
  .site-footer .footer-copy,
  .site-footer .footer-developer {
    font-size: 12px;
    opacity: 0.75;
  }
  .site-footer .footer-developer span {
    font-weight: 600;
    opacity: 1;
  }
</style>
</head>
<body>
<div class="container"><div id="app"></div></div>

<!-- Minimalist Footer -->
<footer class="site-footer">
  <div class="footer-content">
    <div class="footer-brand">A1C DRIVING ACADEMY</div>
    <div class="footer-links">
      <a href="#privacy" onclick="alert('LTO Compliance & Student Data Privacy Policy: All exam responses and personal data are encrypted and transmitted securely for official evaluation.')">Privacy Policy</a>
      <span>&bull;</span>
      <a href="#terms" onclick="alert('Terms of Examination: Misrepresentation or improper assistance during the exam may result in disqualification.')">Terms of Examination</a>
      <span>&bull;</span>
      <a href="#support" onclick="alert('For technical support or inquiries, please approach your designated room proctor.')">Proctor Support</a>
    </div>
    <div class="footer-copy">
      &copy; <script>document.write(new Date().getFullYear())</script> A1C Driving Academy. All rights reserved. | LTO Accredited Driving School
    </div>
    <div class="footer-developer">
      Developed by <span>Gelo Aves</span>
    </div>
  </div>
</footer>

<script>
const AUTH_API_URL = "https://script.google.com/macros/s/AKfycbyoMQPvuxffrZMhTZ4Az4BOPojFRb_A9yBqnbUs_xZh2sl8XAbksObCDlsd-RbeM9qx/exec";
let authStudent = {};
let authAttemptId = "";

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function showStudentInformation() {
  document.getElementById("app").innerHTML = `
    <div class="auth-card">
      <div class="brand">A1C DRIVING ACADEMY</div>
      <h1>TDC EXAMINATION</h1>
      <p class="subtitle">Student Information</p>

      <form onsubmit="requestOtp(event)">
        <label>
          Full Name
          <input name="fullName" required>
        </label>

        <label>
          Package Enrolled
          <input name="packageEnrolled" placeholder="TDC / TDC + PDC" required>
        </label>

        <label>
          Address
          <textarea name="address" required></textarea>
        </label>

        <label>
          LTO Client ID
          <input name="clientId" required>
        </label>

        <label>
          Contact Number
          <input name="contactNumber" required>
        </label>

        <label>
          Email Address
          <input type="email" name="email" required>
        </label>

        <button class="nav-btn primary" type="submit" id="otpBtn">
          VERIFY & REQUEST OTP
        </button>
      </form>

      <p id="authMsg" class="message"></p>
    </div>
  `;
}

async function requestOtp(event) {
  event.preventDefault();

  const button = document.getElementById("otpBtn");
  const message = document.getElementById("authMsg");
  const form = new FormData(event.target);

  authStudent = Object.fromEntries(form.entries());

  button.disabled = true;
  button.textContent = "SENDING OTP...";

  try {
    const response = await fetch(AUTH_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "requestOTP",
        ...authStudent
      })
    });

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.message || "Unable to request OTP.");
    }

    authAttemptId = data.attemptId;
    showOtp();
  } catch (error) {
    message.textContent = error.message;
    button.disabled = false;
    button.textContent = "VERIFY & REQUEST OTP";
  }
}

function showOtp() {
  document.getElementById("app").innerHTML = `
    <div class="auth-card">
      <div class="brand">A1C DRIVING ACADEMY</div>
      <h1>OTP VERIFICATION</h1>

      <p>
        An OTP has been sent to the office email.
        Ask the authorized proctor for the OTP.
      </p>

      <p class="attempt">
        Attempt ID: <b>${esc(authAttemptId)}</b>
      </p>

      <form onsubmit="verifyOtp(event)">
        <label>
          6-Digit OTP
          <input id="otp"
                 inputmode="numeric"
                 maxlength="6"
                 pattern="[0-9]{6}"
                 required
                 autofocus>
        </label>

        <button class="nav-btn primary" type="submit" id="verifyBtn">
          VERIFY OTP
        </button>
      </form>

      <p id="otpMsg" class="message"></p>
    </div>
  `;
}

async function verifyOtp(event) {
  event.preventDefault();

  const button = document.getElementById("verifyBtn");
  const message = document.getElementById("otpMsg");

  button.disabled = true;
  button.textContent = "VERIFYING...";

  try {
    const response = await fetch(AUTH_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "verifyOTP",
        attemptId: authAttemptId,
        otp: document.getElementById("otp").value
      })
    });

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.message || "Invalid OTP.");
    }

    // Guard check to ensure script.js finished loading
    if (typeof window.startAuthenticatedExam !== "function") {
      throw new Error("Exam engine is still loading. Please try again in a moment.");
    }

    window.startAuthenticatedExam({
      student: authStudent,
      attemptId: data.attemptId,
      sessionToken: data.sessionToken
    });
  } catch (error) {
    message.textContent = error.message;
    button.disabled = false;
    button.textContent = "VERIFY OTP";
  }
}

showStudentInformation();
</script>
</body>
</html>
