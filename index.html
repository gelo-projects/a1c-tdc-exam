<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A1C Driving Academy TDC Examination</title>
<link rel="stylesheet" href="style.css">
<script src="script.js" defer></script>
<style>
  .site-footer {
    margin-top: 40px;
    padding: 24px 16px;
    background: transparent;
    color: inherit;
    font-size: 13px;
    text-align: center;
    opacity: 0.85;
  }
  .site-footer .footer-content {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .site-footer .footer-brand {
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .site-footer .footer-links {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .site-footer .footer-links a {
    color: inherit;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }
  .site-footer .footer-links a:hover {
    text-decoration: underline;
    opacity: 1;
  }
  .site-footer .footer-copy,
  .site-footer .footer-developer {
    font-size: 12px;
    opacity: 0.75;
  }
  .site-footer .footer-developer span {
    font-weight: 600;
    opacity: 1;
  }
</style>
</head>
<body>
<div class="container"><div id="app"></div></div>

<footer class="site-footer">
  <div class="footer-content">
    <div class="footer-brand">A1C DRIVING ACADEMY</div>
    <div class="footer-links">
      <a href="#privacy" onclick="alert('LTO Compliance & Student Data Privacy Policy: All exam responses and personal data are encrypted and transmitted securely for official evaluation.')">Privacy Policy</a>
      <span>&bull;</span>
      <a href="#terms" onclick="alert('Terms of Examination: Misrepresentation or improper assistance during the exam may result in disqualification.')">Terms of Examination</a>
      <span>&bull;</span>
      <a href="#support" onclick="alert('For technical support or inquiries, please approach your designated room proctor.')">Proctor Support</a>
    </div>
    <div class="footer-copy">
      &copy; <script>document.write(new Date().getFullYear())</script> A1C Driving Academy. All rights reserved. | LTO Accredited Driving School
    </div>
    <div class="footer-developer">
      Developed by <span>Gelo Aves</span>
    </div>
  </div>
</footer>

<script>
const AUTH_API_URL = "https://script.google.com/macros/s/AKfycbzJARYn7KWb_Dw-kN2uWUHHSF7oql6zNhy8eED9Z69estm6M4Y1yBaQHgH_tEQ6PoRU/exec";
let authStudent = {};
let authAttemptId = "";
let otpResendCooldownTimer = null;
let otpResendCooldownSeconds = 0;

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  }[c]));
}

function showStudentInformation() {
  document.getElementById("app").innerHTML = `
    <div class="auth-card">
      <div class="brand">A1C DRIVING ACADEMY</div>
      <h1>TDC EXAMINATION</h1>
      <p class="subtitle">Student Information</p>

      <form onsubmit="requestOtp(event)">
        <label>
          Access Method
          <select name="accessMode" id="accessMode" onchange="toggleClassroomCode()">
            <option value="otp">Individual OTP</option>
            <option value="classroom">Classroom code</option>
          </select>
        </label>

        <label id="classroomCodeField" hidden>
          Classroom Code
          <input name="classroomCode" id="classroomCode" autocomplete="off" maxlength="32"
                 placeholder="Code provided by your proctor">
          <span class="small">Your proctor must open a live classroom session first.</span>
        </label>

        <label>
          Full Name
          <input name="fullName" required>
        </label>

        <label>
          Package Enrolled
          <input name="packageEnrolled" placeholder="TDC / TDC + PDC" required>
        </label>

        <label>
          Address
          <textarea name="address" required></textarea>
        </label>

        <label>
          LTO Client ID
          <input name="clientId" required>
        </label>

        <label>
          Contact Number
          <input name="contactNumber" required>
        </label>

        <label>
          Email Address
          <input type="email" name="email" required>
        </label>

        <button class="nav-btn primary" type="submit" id="otpBtn">
          CONTINUE
        </button>
      </form>

      <p id="authMsg" class="message"></p>
      <p class="small" style="margin-top:18px">
        Proctors: <a href="proctor.html">open the secure proctor dashboard</a>.
      </p>
    </div>
  `;
}

async function requestOtp(event) {
  event.preventDefault();

  const button = document.getElementById("otpBtn");
  const message = document.getElementById("authMsg");
  const form = new FormData(event.target);

  const formValues = Object.fromEntries(form.entries());
  const accessMode = formValues.accessMode || "otp";
  const classroomCode = String(formValues.classroomCode || "").trim();
  delete formValues.accessMode;
  delete formValues.classroomCode;
  authStudent = formValues;

  button.disabled = true;
  button.textContent = accessMode === "classroom"
    ? "VALIDATING CLASSROOM..."
    : "SENDING OTP...";

  try {
    if (accessMode === "classroom") {
      if (!classroomCode) {
        throw new Error("Enter the classroom code provided by your proctor.");
      }

      const response = await fetch(AUTH_API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({
          action: "validateClassroomAccess",
          ...authStudent,
          classroomCode
        })
      });

      const data = await response.json();

      if (!data.success) {
        throw new Error(data.message || "Unable to validate classroom access.");
      }
      if (!data.attemptId || !data.sessionToken) {
        throw new Error("Classroom validation did not return a valid exam session.");
      }
      if (typeof window.startAuthenticatedExam !== "function") {
        throw new Error("Exam engine is still loading. Please try again in a moment.");
      }

      // These credentials must come from the server response; never derive or accept them from form data.
      authAttemptId = data.attemptId;
      window.startAuthenticatedExam({
        student: authStudent,
        attemptId: data.attemptId,
        sessionToken: data.sessionToken
      });
      return;
    }

    const response = await fetch(AUTH_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "requestOTP",
        ...authStudent,
        accessMode,
        classroomCode: accessMode === "classroom" ? classroomCode : ""
      })
    });

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.message || "Unable to request OTP.");
    }

    authAttemptId = data.attemptId;
    showOtp();
  } catch (error) {
    message.textContent = error.message;
    button.disabled = false;
    button.textContent = "CONTINUE";
  }
}

function toggleClassroomCode() {
  const mode = document.getElementById("accessMode")?.value;
  const field = document.getElementById("classroomCodeField");
  const input = document.getElementById("classroomCode");
  if (!field || !input) return;
  const enabled = mode === "classroom";
  field.hidden = !enabled;
  input.required = enabled;
  if (!enabled) input.value = "";
}

function showOtp() {
  clearOtpResendCooldown();

  document.getElementById("app").innerHTML = `
    <div class="auth-card">
      <div class="brand">A1C DRIVING ACADEMY</div>
      <h1>OTP VERIFICATION</h1>

      <p>
        An OTP has been sent to the office email.
        Ask the authorized proctor for the OTP.
      </p>

      <p class="attempt">
        Attempt ID: <b>${esc(authAttemptId)}</b>
      </p>

      <form onsubmit="verifyOtp(event)">
        <label>
          6-Digit OTP
          <input id="otp"
                 inputmode="numeric"
                 maxlength="6"
                 pattern="[0-9]{6}"
                 required
                 autofocus>
        </label>

        <button class="nav-btn primary" type="submit" id="verifyBtn">
          VERIFY OTP
        </button>
      </form>

      <button class="nav-btn" type="button" id="resendOtpBtn" onclick="resendOtpFromLogin()">
        RESEND OTP
      </button>

      <p id="resendOtpMsg" class="message"></p>
      <p id="otpMsg" class="message"></p>
    </div>
  `;

  startOtpResendCooldown(30);
}

function clearOtpResendCooldown() {
  if (otpResendCooldownTimer) {
    clearInterval(otpResendCooldownTimer);
    otpResendCooldownTimer = null;
  }
  otpResendCooldownSeconds = 0;
}

function startOtpResendCooldown(seconds) {
  clearOtpResendCooldown();

  const button = document.getElementById("resendOtpBtn");
  if (!button) return;

  otpResendCooldownSeconds = Math.max(0, Number(seconds) || 0);

  const update = () => {
    const btn = document.getElementById("resendOtpBtn");
    if (!btn) {
      clearOtpResendCooldown();
      return;
    }

    if (otpResendCooldownSeconds > 0) {
      btn.disabled = true;
      btn.textContent = `RESEND OTP (${otpResendCooldownSeconds}s)`;
      otpResendCooldownSeconds--;
    } else {
      btn.disabled = false;
      btn.textContent = "RESEND OTP";
      clearOtpResendCooldown();
    }
  };

  update();
  otpResendCooldownTimer = setInterval(update, 1000);
}

async function resendOtpFromLogin() {
  const button = document.getElementById("resendOtpBtn");
  const message = document.getElementById("resendOtpMsg");

  if (!button || button.disabled) return;

  if (!authAttemptId) {
    message.textContent = "No OTP attempt is available. Please request an OTP first.";
    return;
  }

  if (typeof window.resendOTP !== "function") {
    message.textContent = "OTP resend service is still loading. Please try again in a moment.";
    return;
  }

  button.disabled = true;
  button.textContent = "RESENDING...";
  message.textContent = "";

  try {
    await window.resendOTP(authAttemptId);

    // The backend enforces the real cooldown and resend limit.
    // The client cooldown only prevents accidental rapid clicks.
    message.textContent = "A new OTP request has been sent. Please ask the authorized proctor for the latest OTP.";
    const otpInput = document.getElementById("otp");
    if (otpInput) {
      otpInput.value = "";
      otpInput.focus();
    }
    startOtpResendCooldown(30);
  } catch (error) {
    message.textContent = error.message || "Unable to resend OTP.";
    button.disabled = false;
    button.textContent = "RESEND OTP";
  }
}

async function verifyOtp(event) {
  event.preventDefault();

  const button = document.getElementById("verifyBtn");
  const message = document.getElementById("otpMsg");

  button.disabled = true;
  button.textContent = "VERIFYING...";

  try {
    const response = await fetch(AUTH_API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: "verifyOTP",
        attemptId: authAttemptId,
        otp: document.getElementById("otp").value
      })
    });

    const data = await response.json();

    if (!data.success) {
      throw new Error(data.message || "Invalid OTP.");
    }

    if (typeof window.startAuthenticatedExam !== "function") {
      throw new Error("Exam engine is still loading. Please try again in a moment.");
    }

    clearOtpResendCooldown();

    window.startAuthenticatedExam({
      student: authStudent,
      attemptId: data.attemptId,
      sessionToken: data.sessionToken
    });
  } catch (error) {
    message.textContent = error.message;
    button.disabled = false;
    button.textContent = "VERIFY OTP";
  }
}

showStudentInformation();
</script>
</body>
</html>
